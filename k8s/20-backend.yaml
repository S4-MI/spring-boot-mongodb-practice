apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: template
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: template-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
            # Same-origin via ingress host; CORS/WS origin allowlist.
            - name: APP_CORS_ALLOWED_ORIGINS
              value: "http://template.local"
          # Spring relaxed-binding: JWT_SECRET -> jwt.secret
          # No actuator dependency -> TCP probe on the server port.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: template
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
