apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: template
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: template-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # NEXT_PUBLIC_* are baked at build time, not read here.
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: template
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
