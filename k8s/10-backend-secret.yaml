apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: template
type: Opaque
stringData:
  # External Mongo on the host machine. minikube exposes the host as
  # host.minikube.internal. Adjust credentials/db as needed.
  SPRING_MONGODB_URI: "mongodb://admin:secret@host.minikube.internal:27017/Blue-App?authSource=admin"
  # base64 string decoding to >= 32 bytes (HS256). Override for prod.
  JWT_SECRET: "eW91ci1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXMtbG9uZyE="
